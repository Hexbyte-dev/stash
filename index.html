<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover extends into notch areas; removed user-scalable=no so users can zoom (accessibility) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6B5F53" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Squirrel" />
  <meta name="description" content="Squirrel away your thoughts" />
  <title>Squirrel</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #FAF7F2; }
    #root { min-height: 100vh; }
    /* Prevent pull-to-refresh on mobile when in standalone mode */
    body { overscroll-behavior-y: contain; }
    /* Safe area for notched phones */
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  </style>

  <!-- React from CDN — pinned to exact versions for security (prevents supply-chain attacks via version drift) -->
  <script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

  <!-- CSP: restrict where scripts, styles, fonts, images, and API calls can come from (defense-in-depth) -->
  <!-- CSP: Build step pre-compiles JSX, so we no longer need unsafe-eval or unsafe-inline for scripts.
       style-src still needs unsafe-inline because React applies inline styles via the style attribute. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:3001 https://stash-server-production-1c71.up.railway.app;">

  <!-- Google Fonts — loaded once here instead of repeated in JSX (Fix #7) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" crossorigin="anonymous">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" crossorigin="anonymous">

  <!-- Boot script: storage shim, service worker registration, install prompt handler -->
  <script src="boot.js"></script>
</head>
<body>
  <!-- Fallback for users with JavaScript disabled -->
  <noscript><p style="padding: 2rem; font-family: sans-serif;">Squirrel requires JavaScript to run.</p></noscript>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
